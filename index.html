<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Захиалга авах — JPNM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12312B; --paper:#F6F3EC; --card:#FFFFFF;
    --teal:#0E6E5C; --teal-dark:#0A4F42; --coral:#D97B4F;
    --line:#E4DFD1; --muted:#6B7570; --good:#2F7D5C; --bad:#C0553B;
    --radius:14px; --shadow: 0 1px 2px rgba(18,49,43,.06), 0 8px 24px rgba(18,49,43,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 90px;}

  header.hero{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .brand-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:6px;}
  h1{font-family:'Source Serif 4',serif;font-weight:700;font-size:clamp(24px,5vw,32px);margin:0;color:var(--teal-dark);letter-spacing:-.01em;}
  .hero-sub{color:var(--muted);font-size:13.5px;margin-top:6px;}
  .conn-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:999px;margin-top:10px;font-weight:600;}
  .conn-ok{background:#E7F3EE;color:var(--good);}
  .conn-bad{background:#FBEAE5;color:var(--bad);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .type-toggle{display:flex;gap:8px;margin-bottom:20px;}
  .type-btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.15s;}
  .type-btn.active{border-color:var(--teal);background:var(--teal);color:#fff;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .card h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--teal-dark);margin:0 0 16px;font-weight:700;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}

  select, input[type=text], input[type=number], input[type=date], input[type=tel]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;
    font-family:inherit;background:#FDFCF9;color:var(--ink);
  }
  select:focus, input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,110,92,.12);}
  input[readonly]{background:#F1EFE7;color:var(--muted);}

  .autofill{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#F6F8F6;border:1px dashed var(--line);
    border-radius:10px;padding:12px;margin:6px 0 16px;font-size:12.5px;}
  .autofill div span.k{display:block;color:var(--muted);font-size:11px;margin-bottom:2px;}
  .autofill div span.v{font-weight:600;}

  .products{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:16px;}
  @media (max-width:520px){.products{grid-template-columns:1fr;}}
  .prod-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;
    border:1px solid var(--line);border-radius:9px;background:#FDFCF9;}
  .prod-item label{font-size:12px;font-weight:500;color:var(--ink);flex:1;}
  .prod-item input{width:64px;text-align:center;padding:6px 8px;}

  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14.5px;
    padding:13px 20px;border-radius:10px;transition:transform .1s, opacity .15s;width:100%;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;
    padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast.ok{background:var(--teal-dark);color:#fff;}
  .toast.err{background:var(--bad);color:#fff;}

  details.devbox{margin-top:6px;}
  details.devbox summary{font-size:11.5px;color:var(--muted);cursor:pointer;}
  .devbox .field{margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand-eyebrow">JPNM · Захиалгын систем</div>
    <h1>Захиалга авах</h1>
    <div class="hero-sub">Захиалгын төрлөө сонгоод бөглөнө үү. Илгээхэд шууд Google Sheets-д бүртгэгдэнэ.</div>
    <span class="conn-badge" id="connBadge"><span class="dot"></span><span id="connText">Холбогдож байна...</span></span>
  </header>

  <div class="type-toggle">
    <button class="type-btn" id="btnIndividual" type="button">Хувь хүний захиалга</button>
    <button class="type-btn active" id="btnPharmacy" type="button">Эмийн сангийн захиалга</button>
  </div>

  <!-- ================= ХУВЬ ХҮНИЙ ЗАХИАЛГЫН ФОРМ ================= -->
  <form id="formIndividual" style="display:none;">
    <div class="card">
      <h2>Захиалагчийн мэдээлэл</h2>
      <div class="field-row">
        <div class="field">
          <label>Захиалагчийн төрөл</label>
          <select id="i_customerType" required></select>
        </div>
        <div class="field"><label>Захиалагчийн нэр</label><input type="text" id="i_customerName" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Утас</label><input type="tel" id="i_phone" required></div>
        <div class="field"><label>Дүүрэг</label><input type="text" id="i_district"></div>
      </div>
      <div class="field">
        <label>Хаяг</label><input type="text" id="i_address">
      </div>
    </div>

    <div class="card">
      <h2>Бүтээгдэхүүн</h2>
      <div class="products" id="i_productGrid"></div>
      <div class="field-row">
        <div class="field"><label>Багц</label><input type="text" id="i_package" placeholder="жиш: Гэр бүлийн багц"></div>
        <div class="field"><label>Үнэ</label><input type="number" id="i_price" min="0" placeholder="₮"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Төлбөрийн хэлбэр</label><select id="i_paymentMethod" required></select></div>
        <div class="field"><label>Захиалга авсан ажилтан</label><input type="text" id="i_staff" placeholder="Ажилтны нэр" required></div>
      </div>
      <div class="field"><label>Захиалга авсан огноо</label><input type="date" id="i_date"></div>
    </div>

    <button class="btn btn-primary" type="submit" id="i_submitBtn">Захиалга илгээх</button>
  </form>

  <!-- ================= ЭМИЙН САНГИЙН ЗАХИАЛГЫН ФОРМ ================= -->
  <form id="formPharmacy">
    <div class="card">
      <h2>Эмийн сан</h2>
      <div class="field-row">
        <div class="field">
          <label>Эмийн сан (компани)</label>
          <select id="p_chain"><option value="">— сонгох —</option></select>
        </div>
        <div class="field">
          <label>Салбар</label>
          <input list="p_branchList" id="p_branch" type="text" placeholder="Компаниа эхлээд сонгоно уу" disabled>
          <datalist id="p_branchList"></datalist>
        </div>
      </div>
      <div class="autofill" id="p_autofill">
        <div><span class="k">Компани</span><span class="v" id="p_afLegal">—</span></div>
        <div><span class="k">Дүүрэг</span><span class="v" id="p_afDistrict">—</span></div>
        <div><span class="k">Утас</span><span class="v" id="p_afPhone">—</span></div>
        <div><span class="k">Хаяг</span><span class="v" id="p_afAddress">—</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Бүтээгдэхүүний тоо ширхэг</h2>
      <div class="products" id="p_productGrid"></div>
      <div class="field-row">
        <div class="field"><label>Захиалга авсан огноо</label><input type="date" id="p_date"></div>
        <div class="field"><label>Захиалга хүлээн авсан ажилтан</label><input type="text" id="p_staff" placeholder="Ажилтны нэр" required></div>
      </div>
    </div>

    <button class="btn btn-primary" type="submit" id="p_submitBtn">Захиалга илгээх</button>
  </form>

  <details class="devbox">
    <summary>⚙ Холболтын тохиргоо (хөгжүүлэгчид)</summary>
    <div class="field">
      <label>Web App URL (энгийн хэрэглэгч бөглөх шаардлагагүй — файлд бэхлэгдсэн байх ёстой)</label>
      <input type="text" id="devUrl" placeholder="https://script.google.com/macros/s/XXXXX/exec">
    </div>
    <button class="btn" id="devSaveBtn" type="button" style="background:#eee;color:#333;">Хадгалах (зөвхөн энэ browser-т)</button>
  </details>
</div>

<div class="toast" id="toast"></div>

const hasClaudeStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
async function localGet(key){
  if(hasClaudeStorage){ try{ const r = await window.storage.get(key); return r ? r.value : null; }catch(e){ return null; } }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function localSet(key, value){
  if(hasClaudeStorage){ try{ await window.storage.set(key, value); }catch(e){} return; }
  try{ localStorage.setItem(key, value); }catch(e){}
}

function showToast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || 'ok');
  setTimeout(()=> t.className = 'toast', 2600);
}

function setConn(ok, text){
  const badge = document.getElementById('connBadge');
  badge.className = 'conn-badge ' + (ok ? 'conn-ok' : 'conn-bad');
  document.getElementById('connText').textContent = text;
}

async function apiPost(action, extra){
  if(!webAppUrl) throw new Error('Web App URL тохируулаагүй байна');
  const res = await fetch(webAppUrl, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, extra))
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function apiGetBootstrap(){
  const res = await fetch(webAppUrl + '?action=bootstrap', { method:'GET' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function loadBootstrap(){
  // хэрэглэгчийн өөрийн хадгалсан dev URL байвал ашиглана (өгөгдмөл CONFIG-ийг дарж бичихгүй бол)
  const savedUrl = await localGet('devWebAppUrl');
  if(savedUrl && !CONFIG.WEB_APP_URL) webAppUrl = savedUrl;
  document.getElementById('devUrl').value = webAppUrl || '';

  if(webAppUrl){
    try{
      boot = await apiGetBootstrap();
      setConn(true, 'Google Sheet-тэй холбогдсон · Master Data ' + boot.pharmacies.length + ' эмийн сан');
    }catch(e){
      console.error(e);
      boot = null;
      setConn(false, 'Холбогдож чадсангүй — offline (локал) горимд ажиллаж байна');
    }
  } else {
    setConn(false, 'Web App URL тохируулаагүй — offline (локал) горимд ажиллаж байна');
  }

  if(!boot){
    boot = {
      pharmacies: FALLBACK_PHARMACIES,
      staff: [],
      individualProducts: FALLBACK_INDIVIDUAL_PRODUCTS,
      pharmacyProducts: FALLBACK_PHARMACY_PRODUCTS,
      paymentMethods: FALLBACK_PAYMENT,
      orderChannels: FALLBACK_CHANNELS,
      customerTypes: FALLBACK_CUSTOMER_TYPES
    };
  }

  buildPharmacyIndex();
  populateStaticDropdowns();
  populateProductGrids();
}

function buildPharmacyIndex(){
  pharmacyIndex = {};
  branchLookup = {};
  (boot.pharmacies || []).forEach(p=>{
    const c = (p.chain||'').trim();
    if(!pharmacyIndex[c]) pharmacyIndex[c] = [];
    pharmacyIndex[c].push(p);
    if(!branchLookup[c]) branchLookup[c] = {};
    branchLookup[c][(p.branch||'').trim()] = p;
  });
}

function fillSelect(sel, options, placeholder){
  sel.innerHTML = '';
  if(placeholder){
    const o = document.createElement('option');
    o.value=''; o.textContent = placeholder;
    sel.appendChild(o);
  }
  options.forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

function populateStaticDropdowns(){
  fillSelect(document.getElementById('i_customerType'), boot.customerTypes, '— сонгох —');
  fillSelect(document.getElementById('i_paymentMethod'), boot.paymentMethods, '— сонгох —');

  const chains = Object.keys(pharmacyIndex).sort();
  const chainSel = document.getElementById('p_chain');
  chainSel.innerHTML = '<option value="">— сонгох —</option>';
  chains.forEach(c=>{
    const o = document.createElement('option');
    o.value = c; o.textContent = `${c} (${pharmacyIndex[c].length})`;
    chainSel.appendChild(o);
  });

  document.getElementById('i_date').valueAsDate = new Date();
  document.getElementById('p_date').valueAsDate = new Date();
}

function populateProductGrids(){
  const iGrid = document.getElementById('i_productGrid');
  iGrid.innerHTML = '';
  (boot.individualProducts||[]).forEach((name,i)=>{
    const w = document.createElement('div'); w.className='prod-item';
    w.innerHTML = `<label for="ip${i}">${name}</label><input type="number" min="0" step="1" id="ip${i}" placeholder="0">`;
    iGrid.appendChild(w);
  });

  const pGrid = document.getElementById('p_productGrid');
  pGrid.innerHTML = '';
  (boot.pharmacyProducts||[]).forEach((name,i)=>{
    const w = document.createElement('div'); w.className='prod-item';
    w.innerHTML = `<label for="pp${i}">${name}</label><input type="number" min="0" step="1" id="pp${i}" placeholder="0">`;
    pGrid.appendChild(w);
  });
}

// ---------------- Эмийн сан dependent dropdown ----------------
document.getElementById('p_chain').addEventListener('change', ()=>{
  const c = document.getElementById('p_chain').value;
  const branchInput = document.getElementById('p_branch');
  const list = document.getElementById('p_branchList');
  list.innerHTML = '';
  branchInput.value = '';
  clearPharmacyAutofill();
  if(!c){ branchInput.disabled = true; branchInput.placeholder = 'Компаниа эхлээд сонгоно уу'; return; }
  branchInput.disabled = false;
  branchInput.placeholder = 'Салбарын нэрээр хайх / сонгох';
  (pharmacyIndex[c]||[]).slice().sort((a,b)=>a.branch.localeCompare(b.branch,'mn')).forEach(p=>{
    const o = document.createElement('option'); o.value = p.branch; list.appendChild(o);
  });
});
document.getElementById('p_branch').addEventListener('input', ()=>{
  const c = document.getElementById('p_chain').value;
  const name = document.getElementById('p_branch').value.trim();
  const rec = c && branchLookup[c] ? branchLookup[c][name] : null;
  if(rec) fillPharmacyAutofill(rec); else clearPharmacyAutofill();
});
function fillPharmacyAutofill(rec){
  document.getElementById('p_afLegal').textContent = rec.legalEntity || '—';
  document.getElementById('p_afDistrict').textContent = rec.district || '—';
  document.getElementById('p_afPhone').textContent = rec.phone || '—';
  document.getElementById('p_afAddress').textContent = rec.address || '—';
}
function clearPharmacyAutofill(){
  ['p_afLegal','p_afDistrict','p_afPhone','p_afAddress'].forEach(id=> document.getElementById(id).textContent = '—');
}

// ---------------- Илгээх: Хувь хүний захиалга ----------------
document.getElementById('formIndividual').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('i_submitBtn');
  const customerType = document.getElementById('i_customerType').value;
  const customerName = document.getElementById('i_customerName').value.trim();
  const phone = document.getElementById('i_phone').value.trim();
  if(!customerType || !customerName || !phone){ showToast('Заавал талбаруудыг бөглөнө үү', 'err'); return; }

  const products = {};
  let any = false;
  (boot.individualProducts||[]).forEach((name,i)=>{
    const v = Number(document.getElementById('ip'+i).value) || 0;
    if(v>0){ products[name] = v; any = true; }
  });
  if(!any){ showToast('Наад зах нь нэг бүтээгдэхүүн сонгоно уу', 'err'); return; }

  const staff = document.getElementById('i_staff').value.trim();
  const paymentMethod = document.getElementById('i_paymentMethod').value;
  if(!staff || !paymentMethod){ showToast('Ажилтны нэр / төлбөрийн хэлбэр бөглөнө үү', 'err'); return; }

  const payload = {
    customerType, customerName, phone,
    district: document.getElementById('i_district').value.trim(),
    address: document.getElementById('i_address').value.trim(),
    products,
    package: document.getElementById('i_package').value.trim(),
    price: document.getElementById('i_price').value,
    paymentMethod, staff,
    date: document.getElementById('i_date').value
  };

  btn.disabled = true; btn.textContent = 'Илгээж байна...';
  try{
    const result = await apiPost('add', { orderType:'individual', payload });
    if(result.status === 'ok'){
      showToast('Захиалга №' + result.no + ' амжилттай бүртгэгдлээ ✓', 'ok');
      e.target.reset();
      document.getElementById('i_date').valueAsDate = new Date();
      populateProductGrids();
    } else {
      showToast('Захиалга илгээгдсэнгүй: ' + (result.message || 'алдаа'), 'err');
    }
  }catch(err){
    showToast('Захиалга илгээгдсэнгүй. Дахин оролдоно уу.', 'err');
    console.error(err);
  }finally{
    btn.disabled = false; btn.textContent = 'Захиалга илгээх';
  }
});

    showToast('Захиалга илгээгдсэнгүй. Дахин оролдоно уу.', 'err');
    console.error(err);
  }finally{
    btn.disabled = false; btn.textContent = 'Захиалга илгээх';
  }
});
